name: Import native harbor reference images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-harbor-native-assets.yml

permissions:
  contents: write

jobs:
  import-native-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download original PNG files from shared Drive folder
        shell: bash
        run: |
          set -euo pipefail
          dir="docs/design/assets/first-harbor-town"
          mkdir -p "$dir"

          curl -L --fail --retry 3 \
            "https://drive.usercontent.google.com/download?id=1FMoRXWXkodeemaVjCsanvIoMOJb7KJQ7&export=download&authuser=0&confirm=t" \
            -o "$dir/primary-reference.png"
          curl -L --fail --retry 3 \
            "https://drive.usercontent.google.com/download?id=1A7rMFQAMEQOM1JrkkTAPdsjK3hIcBgaK&export=download&authuser=0&confirm=t" \
            -o "$dir/design-board-reference.png"
          curl -L --fail --retry 3 \
            "https://drive.usercontent.google.com/download?id=1S3z8umxZjdWGgbv9MVNBAcDvG0WfoPOa&export=download&authuser=0&confirm=t" \
            -o "$dir/layout-board-reference.png"
          curl -L --fail --retry 3 \
            "https://drive.usercontent.google.com/download?id=19W85dk6t5h2SpR_TRvSFn2y8T9q5uqhd&export=download&authuser=0&confirm=t" \
            -o "$dir/aerial-board-reference.png"

      - name: Verify native PNG signatures, dimensions and source sizes
        shell: python
        run: |
          from pathlib import Path
          import struct

          expected = {
              "primary-reference.png": (3361617, (1448, 1086)),
              "design-board-reference.png": (2935208, (1536, 1024)),
              "layout-board-reference.png": (3208381, (1536, 1024)),
              "aerial-board-reference.png": (3086536, (1536, 1024)),
          }
          root = Path("docs/design/assets/first-harbor-town")
          for name, (expected_size, expected_dims) in expected.items():
              path = root / name
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{name}: not a PNG")
              if len(data) != expected_size:
                  raise SystemExit(f"{name}: size {len(data)} != {expected_size}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != expected_dims:
                  raise SystemExit(f"{name}: dimensions {(width, height)} != {expected_dims}")
              print(f"OK {name}: {len(data)} bytes, {width}x{height}")

      - name: Replace lightweight previews and repair documentation links
        shell: python
        run: |
          from pathlib import Path

          asset_dir = Path("docs/design/assets/first-harbor-town")
          for name in (
              "primary-reference.jpg",
              "design-board-reference.jpg",
              "layout-board-reference.jpg",
              "aerial-board-reference.jpg",
          ):
              path = asset_dir / name
              if path.exists():
                  path.unlink()

          files = [
              Path("docs/design/assets/first-harbor-town/README.md"),
              Path("docs/design/world/first-harbor-town-v1.md"),
              Path("docs/design/visual-output-guidelines.md"),
          ]
          for path in files:
              text = path.read_text(encoding="utf-8")
              text = text.replace("primary-reference.jpg", "primary-reference.png")
              text = text.replace("design-board-reference.jpg", "design-board-reference.png")
              text = text.replace("layout-board-reference.jpg", "layout-board-reference.png")
              text = text.replace("aerial-board-reference.jpg", "aerial-board-reference.png")
              text = text.replace(
                  "GitHub表示用画像はリポジトリを過度に重くしないよう軽量化したJPEGプレビュー。",
                  "GitHub上の画像は設計セッションで承認されたネイティブ解像度の元PNGをそのまま保存する。",
              )
              path.write_text(text, encoding="utf-8")

      - name: Remove one-shot importer and commit native originals
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .github/workflows/import-harbor-native-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design/assets/first-harbor-town docs/design/world/first-harbor-town-v1.md docs/design/visual-output-guidelines.md
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "docs: restore native harbor reference images"
          git push origin HEAD:main
