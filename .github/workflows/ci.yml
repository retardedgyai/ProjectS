name: ProjectS CI

on:
  pull_request:
  push:
    branches:
      - main
      - integration/beta-full-build

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Run checks
        run: ./gradlew clean check -PskipAutoStart --no-daemon
